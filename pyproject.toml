[project]
name = "video-creator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["opencc-python-reimplemented>=0.1.7,<0.2"]

[project.scripts]
vc = "videocreator.cli:main"

[tool.setuptools]
packages = ["videocreator"]
py-modules = ["main"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: runs the real Remotion and FFmpeg toolchain"]
